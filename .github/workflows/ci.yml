name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      # The end-to-end example asserts the delivered model meets its budget. It is a timing
      # check, so a loaded CI runner can make it flaky -- it runs, but does not gate the build.
      # Trust the unit tests for correctness and this for "does the whole path still work".
      - name: End-to-end smoke
        continue-on-error: true
        run: python examples/smoke_end_to_end.py
